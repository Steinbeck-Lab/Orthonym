[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orthonym"
version = "1.0.0"
description = "Open Structure-To-IUPAC-Name Generator - Rule-based IUPAC nomenclature from molecular structures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kohulan Rajan" }
]
keywords = [
    "chemistry",
    "IUPAC",
    "nomenclature",
    "cheminformatics",
    "RDKit",
    "SMILES",
    "structure-to-name"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2023.03.1",
    "lxml>=4.6",  # OPSIN grammar XML parsing on the default naming path
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=5.0",  # sub-50ms p99 timing gate
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "rapidfuzz>=3.14.0",  # eval-only: Damerau-Levenshtein secondary metric; not used on the naming path
    "requests>=2.25",  # optional PubChem PUG-REST lookup (validation/pubchem_validator.py)
]
# Optional ML fallback extra.
# STOUT-pypi 2.0.5 hard-pins tensorflow==2.10.1, which has no Python 3.12
# wheel (TF Python 3.12 support requires TF >= 2.16.0), so the [ml] optional
# extra requires Python <= 3.11. The default rule-based pipeline keeps full
# Python 3.10/3.11/3.12 compatibility.
#
# Alternatively, users may vendor the model via git-LFS under
# models/stout-v2-2.0.5/ and set ORTHONYM_STOUT_MODEL_ROOT to bypass the
# upstream download path.
ml = [
    "STOUT-pypi==2.0.5; python_version < '3.12'",
]
# Performance-only extra: one in-process JVM instead of a `java -jar` subprocess
# per call (src/orthonym/jvm_bridge.py). Measured 2026-07-30 on the real
# single-molecule centres pattern: 216 ms/call -> 0.8 ms/call.
#
# OPTIONAL, deliberately: every JVM bridge keeps its subprocess path and falls
# back to it when jpype is absent or the JVM will not start, so this changes only
# how fast a name is produced, never whether or what. Byte-identity was verified
# against the real CLI (217 names x 2 OPSIN configs, 508 centres SMILES, 0
# mismatches). Set ORTHONYM_DISABLE_JPYPE=1 to force the subprocess path.
jvm = [
    "jpype1>=1.5",
]

[project.scripts]
orthonym = "orthonym.cli:main"

[project.urls]
Homepage = "https://github.com/Kohulan/Orthonym"
Documentation = "https://github.com/Kohulan/Orthonym#readme"
Repository = "https://github.com/Kohulan/Orthonym"

[tool.hatch.build.targets.wheel]
packages = ["src/orthonym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests (<1s each)",
    "integration: Compound class integration tests",
    "roundtrip: Round-trip validation with OPSIN",
    "slow: Full validation suite (100k+ compounds)",
    "benchmark: Performance benchmark tests (pytest-benchmark)",
]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
