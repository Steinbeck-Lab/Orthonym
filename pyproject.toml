[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orthonym"
version = "0.1.0"
description = "Open Structure-To-IUPAC-Name Generator - Rule-based IUPAC nomenclature from molecular structures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kohulan Rajan" }
]
keywords = [
    "chemistry",
    "IUPAC",
    "nomenclature",
    "cheminformatics",
    "RDKit",
    "SMILES",
    "structure-to-name"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2023.03.1",
    "rapidfuzz>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=5.0",  # NEW per Phase 156 D-16 < 50ms p99 hard gate
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
# Phase 162 ML Fallback Gate (MLF-01 + CONTEXT D-02 optional extra).
# Per 162-AUDIT-MLF.md § 1.2 R-01 AUTO-PICK resolution (b):
# STOUT-pypi 2.0.5 hard-pins tensorflow==2.10.1 which has no Python 3.12
# wheel (TF Python 3.12 support requires TF >= 2.16.0). The [ml] optional
# extra therefore requires Python <= 3.11.
#
# Default-OFF rule-based pipeline preserves FULL Python 3.10/3.11/3.12
# compat (CONTEXT line 50 public API stability promise upheld).
#
# Fallback (a) per audit § 1.3: users may vendor the model via git-LFS
# under models/stout-v2-2.0.5/ and set ORTHONYM_STOUT_MODEL_ROOT env var,
# bypassing the upstream Zenodo download path while R-02 is unresolved.
ml = [
    "STOUT-pypi==2.0.5; python_version < '3.12'",
]

[project.scripts]
orthonym = "orthonym.cli:main"

[project.urls]
Homepage = "https://github.com/Kohulan/Orthonym"
Documentation = "https://github.com/Kohulan/Orthonym#readme"
Repository = "https://github.com/Kohulan/Orthonym"

[tool.hatch.build.targets.wheel]
packages = ["src/orthonym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests (<1s each)",
    "integration: Compound class integration tests",
    "roundtrip: Round-trip validation with OPSIN",
    "slow: Full validation suite (100k+ compounds)",
    "benchmark: Performance benchmark tests (pytest-benchmark)",
]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
