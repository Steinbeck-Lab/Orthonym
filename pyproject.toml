[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orthonym"
version = "1.0.1"
description = "Open Structure-To-IUPAC-Name Generator - Rule-based IUPAC nomenclature from molecular structures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kohulan Rajan" },
    { name = "Achim Zielesny" },
    { name = "Christoph Steinbeck" },
]
keywords = [
    "chemistry",
    "IUPAC",
    "nomenclature",
    "cheminformatics",
    "RDKit",
    "SMILES",
    "structure-to-name"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    # Pinned to the exact versions this engine is developed and tested against,
    # for reproducible naming output.
    "rdkit==2026.3.5",
    "lxml==6.1.3",  # OPSIN grammar XML parsing on the default naming path
    # In-process JVM for OPSIN + CIP (src/orthonym/jvm_bridge.py). Default since
    # 2026-09-03: measured 36 ms vs 297 ms per molecule (leucine) against the
    # `java -jar` subprocess path, byte-identical output. Every bridge keeps its
    # subprocess fallback when jpype or the JVM is unavailable; set
    # ORTHONYM_DISABLE_JPYPE=1 to force it. The [jvm] extra below stays as a
    # no-op alias so existing `pip install orthonym[jvm]` commands keep working.
    "jpype1==1.7.1",
]

[project.optional-dependencies]
dev = [
    # Pinned to the exact versions in use.
    "pytest==9.0.3",
    "pytest-benchmark==5.2.3",  # p99 latency gate
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "rapidfuzz==3.14.5",  # eval-only: Damerau-Levenshtein secondary metric (eval/harness.py); not used on the naming path
    "requests==2.33.1",  # optional PubChem PUG-REST lookup (validation/pubchem_validator.py)
]
# Performance-only extra: one in-process JVM instead of a `java -jar` subprocess
# per call (src/orthonym/jvm_bridge.py). Measured 2026-07-30 on the real
# single-molecule centres pattern: 216 ms/call -> 0.8 ms/call.
#
# OPTIONAL, deliberately: every JVM bridge keeps its subprocess path and falls
# back to it when jpype is absent or the JVM will not start, so this changes only
# how fast a name is produced, never whether or what. Byte-identity was verified
# against the real CLI (217 names x 2 OPSIN configs, 508 centres SMILES, 0
# mismatches). Set ORTHONYM_DISABLE_JPYPE=1 to force the subprocess path.
jvm = [
    "jpype1==1.7.1",  # kept as an alias; jpype1 is a core dependency since 2026-09-03
]
# The documentation site in guide/ (sphinx-build -W -b html guide _build/html).
# Pinned to the versions the site is built and checked with.
docs = [
    "sphinx==9.1.0",
    "shibuya==2026.7.12",
    "myst-parser==5.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-argparse==0.6.1",
]

[project.scripts]
orthonym = "orthonym.cli:main"

[project.urls]
Homepage = "https://github.com/Steinbeck-Lab/Orthonym"
Documentation = "https://steinbeck-lab.github.io/Orthonym/"
Repository = "https://github.com/Steinbeck-Lab/Orthonym"

[tool.hatch.build.targets.wheel]
packages = ["src/orthonym"]

# Install-time prefetch of the pinned OPSIN / centres jars into the user cache
# (hatch_build.py). The jars are never put into the wheel or the sdist.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["*.jar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests (<1s each)",
    "integration: Compound class integration tests",
    "roundtrip: Round-trip validation with OPSIN",
    "slow: Full validation suite (100k+ compounds)",
    "benchmark: Performance benchmark tests (pytest-benchmark)",
]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
