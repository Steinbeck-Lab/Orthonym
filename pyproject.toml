[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orthonym"
version = "0.1.0"
description = "Open Structure-To-IUPAC-Name Generator - Rule-based IUPAC nomenclature from molecular structures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kohulan Rajan" }
]
keywords = [
    "chemistry",
    "IUPAC",
    "nomenclature",
    "cheminformatics",
    "RDKit",
    "SMILES",
    "structure-to-name"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2023.03.1",
    "rapidfuzz>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
orthonym = "orthonym.cli:main"

[project.urls]
Homepage = "https://github.com/Kohulan/Orthonym"
Documentation = "https://github.com/Kohulan/Orthonym#readme"
Repository = "https://github.com/Kohulan/Orthonym"

[tool.hatch.build.targets.wheel]
packages = ["src/orthonym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests (<1s each)",
    "integration: Compound class integration tests",
    "roundtrip: Round-trip validation with OPSIN",
    "slow: Full validation suite (100k+ compounds)",
]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
