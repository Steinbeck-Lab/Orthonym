name: CI

# Lightweight public CI: install the package, confirm it imports and names a
# handful of molecules correctly, and run advisory linting. Does not depend on
# the internal benchmark baselines or the large corpora — a contributor's PR can
# pass this without the full benchmarking apparatus.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-smoke:
    name: Install + naming smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java 17 (for OPSIN round-trip validation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify bundled OPSIN jar present
        run: test -f opsin-cli-2.9.0-jar-with-dependencies.jar

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Naming smoke test
        run: |
          python - <<'PY'
          from orthonym import name_compound
          cases = {
              "CCO": "ethanol",
              "CC(=O)O": "acetic acid",
              "c1ccccc1": "benzene",
              "CCN": "ethanamine",
          }
          fails = []
          for smi, want in cases.items():
              got = name_compound(smi)
              print(f"{smi:12s} -> {got!r}  (want {want!r})")
              if got != want:
                  fails.append((smi, got, want))
          if fails:
              raise SystemExit(f"smoke test failed: {fails}")
          print("smoke OK")
          PY

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check (advisory)
        run: ruff check src || true
