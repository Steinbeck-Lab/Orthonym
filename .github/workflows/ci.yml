name: CI

# Public CI: install the package, confirm it imports and names a handful of
# molecules correctly, check that no new function or file outgrows the
# source-size budget, run the test suite, and run advisory linting. Does not
# depend on the internal benchmark baselines or the large corpora — a
# contributor's PR can pass this without the full benchmarking apparatus.
#
# The test suite runs every test except those marked `slow` on each push and
# pull request; the nightly run includes the `slow` tests and runs the OPSIN
# round-trip calls of the tests against the real `java -jar opsin` command line
# (the push and pull-request runs answer them in process).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # nightly, 02:00 UTC: the full suite incl. `slow`
  workflow_dispatch:

env:
  ORTHONYM_REQUIRE_JARS: "1"   # a missing jar fails tests instead of skipping them

jobs:
  build-and-smoke:
    name: Install + naming smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java 17 (for OPSIN round-trip validation)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install package
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch and verify the OPSIN and centres jars
        # The jars are not in the repository; this downloads them from their
        # official releases and checks the pinned SHA-256 (fails the job otherwise).
        run: orthonym --fetch-jars

      - name: Naming smoke test
        run: |
          python - <<'PY'
          from orthonym import name_compound
          cases = {
              "CCO": "ethanol",
              "CC(=O)O": "acetic acid",
              "c1ccccc1": "benzene",
              "CCN": "ethanamine",
          }
          fails = []
          for smi, want in cases.items():
              got = name_compound(smi)
              print(f"{smi:12s} -> {got!r}  (want {want!r})")
              if got != want:
                  fails.append((smi, got, want))
          if fails:
              raise SystemExit(f"smoke test failed: {fails}")
          print("smoke OK")
          PY

      - name: Source size budget
        # No function over 200 lines and no file over 5,000 lines in src/orthonym,
        # except those already listed in tests/support/size_budget_baseline.py,
        # which may not grow (and the list may only shrink). Pure ast: no JVM, no
        # jars, a few seconds. Runs even when the smoke test failed, so one run
        # reports both (but not when the install itself failed).
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest tests/unit/test_size_budget.py -q -o addopts=""

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java 17 (for OPSIN round-trip validation)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch and verify the OPSIN and centres jars
        run: orthonym --fetch-jars

      - name: Run the tests (all except `slow`)
        if: github.event_name != 'schedule'
        # --timeout stops one stuck test (for example a blocked OPSIN pipe)
        # instead of letting it hold the whole job. The thread method leaves
        # SIGALRM to the naming time limit (orthonym.wallclock) and its tests.
        run: python -m pytest tests -m "not slow" -n auto -q --tb=short --timeout=900 --timeout-method=thread -o addopts=""

      - name: Run all tests, `slow` included (nightly)
        if: github.event_name == 'schedule'
        # The PR run answers the tests' `java -jar opsin` calls in process
        # (tests/support/opsin_cli_inproc.py); the nightly run keeps the real command line.
        env:
          ORTHONYM_TEST_REAL_OPSIN_CLI: "1"
        run: python -m pytest tests -n auto -q --tb=short --timeout=1800 --timeout-method=thread -o addopts=""

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check (advisory)
        run: ruff check src || true
